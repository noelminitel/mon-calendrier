<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>vpembed</title>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.7.7/angular.min.js"></script>
<script src="https://apis.google.com/js/api.js"></script>

<style>
body {
	font-family: Arial;
}
#embedgrid {
	width: 80vw;
	height: 80vh;
}
</style>
</head>

<body ng-app="vpApp" ng-controller="vpEmbedController" ng-cloak>
<h2>visual-planner embedded example</h2>
<vp-grid id="embedgrid"></vp-grid>

<script src="https://visual-planner.github.io/vplib.js" type='text/javascript'></script>

<script type='text/javascript'>
angular.module("vpApp").controller("vpEmbedController", function($scope, vpGCal) {
	gapi.load('client', function(){
		// create an API key at https://console.cloud.google.com/apis/credentials
		gapi.client.setApiKey("*******************************");

		// modify $scope.vp properties to customise appearance
		console.log($scope.vp);
		$scope.vp.gridoptions = {shownavbar: true, showcalbar: true, redboxtoday: true};
		$scope.vp.appdata.month_count = 4;

		// add calendars which must be shared publicly
		vpGCal.addPublicCalendar("**************************@group.calendar.google.com", "name1", "orange", "red");
		vpGCal.addPublicCalendar("**************************@group.calendar.google.com", "name2", "#0000ff", "#ffff00");
		vpGCal.loadPublicCalendarEvents();
	});
});
</script>

</body>
</html>
