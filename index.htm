<!DOCTYPE html>
<html lang="fr" ng-app="vp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Calendrier</title>
    
    <!-- Styles CSS de base (ajustez selon vos fichiers CSS locaux si vous en avez) -->
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f4f9; }
        header { background: #333; color: #fff; padding: 15px; text-align: center; border-radius: 5px; }
        .container { margin-top: 20px; background: #fff; padding: 20px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        button { padding: 8, 15px; cursor: pointer; }
    </style>

    <!-- AngularJS 1.6.4 -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.4/angular.min.js"></script>
    
    <!-- Google APIs & Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>
</head>
<body ng-controller="main">

    <!-- En-tête de l'application -->
    <header>
        <h1>{{settings.banner_text}}</h1>
        <p>{{sign_msg}}</p>
        <div>
            <button ng-hide="signed_in" ng-click="onclickSignIn()">Sign In</button>
            <button ng-show="signed_in" ng-click="onclickSignOut()">Sign Out</button>
            <button ng-show="signed_in" ng-click="onclickSettings()">Paramètres</button>
            <button ng-show="signed_in && view == 'home'" ng-click="onclickPrintView()">Mode Impression</button>
            <button ng-show="view == 'print'" ng-click="onclickClosePrintView()">Fermer Impression</button>
        </div>
    </header>

    <!-- Contenu principal géré par les vues AngularJS -->
    <div class="container">
        
        <!-- Vue Accueil / Calendrier -->
        <div ng-show="view == 'home'">
            <h2>Mon Calendrier</h2>
            <p ng-hide="signed_in">Veuillez vous connecter pour afficher votre calendrier.</p>
            <div id="calendar-container"></div>
        </div>

        <!-- Vue Paramètres -->
        <div ng-show="view == 'settings'">
            <h2>Paramètres de l'application</h2>
            <form name="form">
                <label>Texte de la bannière :</label><br>
                <input type="text" ng-model="settings.banner_text" style="width: 100%; padding: 8px; margin-top: 5px;"><br><br>
                
                <button type="button" ng-click="onclickSave()">Enregistrer</button>
                <button type="button" ng-click="onclickCancel()">Annuler</button>
            </form>
        </div>

        <!-- Vue Impression -->
        <div ng-show="view == 'print'">
            <h2>Aperçu avant impression</h2>
            <p>Génération de la vue d'impression en cours...</p>
        </div>

    </div>

    <!-- Vos scripts personnalisés -->
    <script src="vip_oauth.js"></script>
    <script src="vp.js"></script>

    <!-- Sécurité de secours si vp_main n'est pas trouvé dans vp.js -->
    <script>
        if (typeof vp_main === 'undefined') {
            console.warn("Avertissement : vp_main n'était pas défini, chargement du contrôleur de secours.");
            window.vp_main = function($scope) {
                $scope.view = "home";
                $scope.signed_in = false;
                $scope.sign_msg = "Non connecté";
                $scope.settings = { banner_text: "Mon Calendrier" };
                
                var account = new AuthAccount();
                account.authClientID = typeof VP_CLIENT_ID !== 'undefined' ? VP_CLIENT_ID : '';
                account.authScope = "https://www.googleapis.com/auth/calendar.readonly";

                account.onSignIn = function() {
                    $scope.$applyAsync(() => { $scope.signed_in = true; $scope.sign_msg = "Connecté : " + account.getEmail(); });
                };
                account.onSignOut = function() {
                    $scope.$applyAsync(() => { $scope.signed_in = false; $scope.sign_msg = "Non connecté"; $scope.view = "settings"; });
                };

                $scope.onclickSignIn = () => account.SignIn();
                $scope.onclickSignOut = () => account.SignOut();
                $scope.onclickSettings = () => $scope.view = "settings";
                $scope.onclickPrintView = () => $scope.view = "print";
                $scope.onclickClosePrintView = () => $scope.view = "home";

                account.Connect();
            };
        }

        var app = angular.module("vp", []);
        app.controller("main", vp_main);
    </script>
</body>
</html>
