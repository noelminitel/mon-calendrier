<!DOCTYPE html>
<html lang="fr" ng-app="vp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Calendrier</title>
    
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f4f9; }
        header { background: #333; color: #fff; padding: 15px; text-align: center; border-radius: 5px; }
        .container { margin-top: 20px; background: #fff; padding: 20px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        button { padding: 8px 15px; cursor: pointer; margin: 5px; }
    </style>

    <!-- Votre ID client Google OAuth -->
    <script>
        var vp_oauthClientID = '749475982945-me64prs1nn6og0ghqj7ifgc4c6js71ta.apps.googleusercontent.com';
        var VP_CLIENT_ID = vp_oauthClientID; // Rétrocompatibilité
    </script>

    <!-- AngularJS 1.6.4 -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.4/angular.min.js"></script>
    
    <!-- Google APIs & Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>
</head>
<body ng-controller="main">

    <header>
        <h1>{{settings.banner_text}}</h1>
        <p>{{sign_msg}}</p>
        <div>
            <button ng-hide="signed_in" ng-click="onclickSignIn()">Sign In</button>
            <button ng-show="signed_in" ng-click="onclickSignOut()">Sign Out</button>
            <button ng-show="signed_in" ng-click="onclickSettings()">Paramètres</button>
            <button ng-show="signed_in && view == 'home'" ng-click="onclickPrintView()">Mode Impression</button>
            <button ng-show="view == 'print'" ng-click="onclickClosePrintView()">Fermer Impression</button>
        </div>
    </header>

    <div class="container">
        <!-- Vue Accueil -->
        <div ng-show="view == 'home'">
            <h2>Mon Calendrier</h2>
            <p ng-hide="signed_in">Veuillez vous connecter pour afficher votre calendrier.</p>
            <div id="calendar-container"></div>
        </div>

        <!-- Vue Paramètres -->
        <div ng-show="view == 'settings'">
            <h2>Paramètres de l'application</h2>
            <form name="form">
                <label>Texte de la bannière :</label><br>
                <input type="text" ng-model="settings.banner_text" style="width: 100%; padding: 8px; margin-top: 5px;"><br><br>
                <button type="button" ng-click="onclickSave()">Enregistrer</button>
                <button type="button" ng-click="onclickCancel()">Annuler</button>
            </form>
        </div>

        <!-- Vue Impression -->
        <div ng-show="view == 'print'">
            <h2>Aperçu avant impression</h2>
            <p>Génération de la vue d'impression en cours...</p>
        </div>
    </div>

    <!-- Script d'authentification -->
    <script src="vip_oauth.js"></script>

    <!-- Contrôleur principal intégré -->
    <script>
        function vp_main($scope, $timeout) {
            $scope.view = "home";
            $scope.signed_in = false;
            $scope.sign_msg = "Non connecté";
            $scope.busy = false;

            $scope.multi_col_count_options = { 1: "1", 2: "2", 3: "3", 4: "4", 6: "6", 12: "12" };
            
            $scope.settings = {
                banner_text: "Mon Calendrier",
                vipconfig: { multi_col_count: 4, auto_scroll: true }
            };

            var account = new AuthAccount();
            account.authClientID = typeof vp_oauthClientID !== 'undefined' ? vp_oauthClientID : (typeof VP_CLIENT_ID !== 'undefined' ? VP_CLIENT_ID : '');
            account.authScope = "https://www.googleapis.com/auth/calendar.readonly";

            account.onSignIn = function() {
                $scope.$applyAsync(function() {
                    $scope.signed_in = true;
                    $scope.sign_msg = "Connecté en tant que : " + account.getEmail();
                    $scope.view = "home";
                    if (typeof LoadCalendar === 'function') LoadCalendar();
                });
            };

            account.onSignOut = function() {
                $scope.$applyAsync(function() {
                    $scope.signed_in = false;
                    $scope.sign_msg = "Non connecté";
                    $scope.view = "settings";
                });
            };

            account.onError = function(msg) {
                $scope.$applyAsync(function() {
                    $scope.sign_msg = "Erreur : " + msg;
                });
            };

            $scope.onclickSignIn = function() { account.SignIn(); };
            $scope.onclickSignOut = function() { account.SignOut(); };
            $scope.onclickSettings = function() { $scope.view = "settings"; };
            $scope.onclickPrintView = function() { 
                $scope.view = "print"; 
                if (typeof BuildPrintView === 'function') BuildPrintView();
            };
            $scope.onclickClosePrintView = function() { $scope.view = "home"; };

            $scope.onclickSave = function() {
                $scope.busy = true;
                if (typeof SaveSettings === 'function') {
                    SaveSettings(function() {
                        $scope.$applyAsync(function() {
                            $scope.busy = false;
                            if ($scope.form) $scope.form.$setPristine();
                        });
                    });
                } else {
                    $scope.busy = false;
                }
            };

            $scope.onclickCancel = function() {
                if (typeof LoadSettings === 'function') LoadSettings();
                $scope.view = "home";
                if ($scope.form) $scope.form.$setPristine();
            };

            angular.element(document).ready(function() {
                if (typeof LoadSettings === 'function') LoadSettings();
                account.Connect();
            });
        }

        var app = angular.module("vp", []);
        app.controller("main", vp_main);
    </script>
</body>
</html>
